services:
  - type: web
    name: despensa-bot
    runtime: node
    repo: https://github.com/luebsgrafic/despensa-bot
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
